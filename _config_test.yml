url: "https://dietbank.hp.gbif-test.org/" # the base hostname & protocol for your staging site, e.g. https://example.hp.gbif-test.org

siteMeasurements:
  enable: false

graphqlEndpoint: "https://graphql.gbif-test.org/graphql"

# The test site reads from gbif-test, where the Dietbank test dataset lives
gbifApacheInclude:
  componentsScriptJsModule: https://www-lib.gbif-test.org/gbif-lib.js
dietbank:
  hostIndex: /assets/data/hosts-test.json
  scopeDatasets: test_datasets # limit the occurrence search to the keys in _data/test_datasets.yml
